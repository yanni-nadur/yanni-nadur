<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 332" role="img" aria-labelledby="title desc">
  <title id="title">Software engineering, from interface to infrastructure</title>
  <desc id="desc">Dark midnight gradient with cyan and amber highlights, an abstract map of connected app, API, data and AI components.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111e2b"/><stop offset="0.56" stop-color="#0c1320"/><stop offset="1" stop-color="#080e17"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6ce4e2" stop-opacity=".14"/><stop offset="1" stop-color="#6ce4e2" stop-opacity=".8"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e9b86c"/><stop offset="1" stop-color="#fbbd82"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#4edbd5" stop-opacity=".24"/><stop offset="1" stop-color="#4edbd5" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse"><path d="M 27 0 L 0 0 0 27" fill="none" stroke="#cde4ee" stroke-opacity=".045" stroke-width="1"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="shine"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1200" height="332" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="332" rx="18" fill="url(#grid)"/>
  <circle cx="895" cy="155" r="250" fill="url(#glow)"/>
  <path d="M 30 16 H 1170 Q 1184 16 1184 30 V 301 Q 1184 316 1170 316 H 30 Q 16 316 16 301 V 30 Q 16 16 30 16 Z" fill="none" stroke="#6ce4e2" stroke-opacity=".16"/>
  <circle cx="55" cy="43" r="5" fill="#ebad70"/><circle cx="73" cy="43" r="5" fill="#77d4cb"/><circle cx="91" cy="43" r="5" fill="#6b758a"/>
  <text x="115" y="48" fill="#8eacbc" font-family="Consolas, Menlo, monospace" font-size="15" letter-spacing="1.6">YANNI / SOFTWARE ENGINEERING</text>
  <line x1="48" y1="70" x2="600" y2="70" stroke="#d3eff3" stroke-opacity=".12"/>
  <text x="58" y="136" fill="#d9f5f5" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.6">Built for people.</text>
  <text x="58" y="199" fill="#d9f5f5" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.6">Engineered to last<tspan fill="#ffbe85">.</tspan></text>
  <text x="59" y="238" fill="#a5bbc8" font-family="Consolas, Menlo, monospace" font-size="16">C#/.NET  ·  TypeScript  ·  React  ·  AI systems</text>
  <rect x="59" y="263" width="168" height="34" rx="17" fill="#0d2a32" stroke="#50d5d1" stroke-opacity=".45"/>
  <circle cx="77" cy="280" r="4" fill="#6ce4e2"><animate attributeName="opacity" values=".4;1;.4" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="90" y="285" fill="#8fe5df" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="600">build / ship / learn</text>
  <g transform="translate(676,61)">
    <g fill="none" stroke="#6de4e1" stroke-opacity=".33" stroke-width="2">
      <path d="M 109 77 H 202"/><path d="M 288 77 H 346"/><path d="M 248 112 V 170"/><path d="M 110 77 C 112 176 122 207 205 208"/><path d="M 290 208 H 346"/>
    </g>
    <g fill="#071722" stroke="#71cbd2" stroke-opacity=".4" stroke-width="1.5">
      <rect x="0" y="39" width="110" height="78" rx="12"/>
      <rect x="202" y="39" width="86" height="78" rx="12"/>
      <rect x="346" y="39" width="115" height="78" rx="12"/>
      <rect x="203" y="171" width="87" height="75" rx="12"/>
      <rect x="346" y="171" width="115" height="75" rx="12"/>
    </g>
    <g font-family="Consolas, Menlo, monospace" font-size="15" text-anchor="middle" letter-spacing="1">
      <text x="55" y="84" fill="#dff9f5">UI</text>
      <text x="245" y="84" fill="#dff9f5">API</text>
      <text x="403" y="84" fill="#dff9f5">DATA</text>
      <text x="247" y="216" fill="#ffc18e">AI</text>
      <text x="403" y="216" fill="#dff9f5">EVENTS</text>
    </g>
    <g fill="#69e4dc">
      <circle cx="157" cy="77" r="5"><animate attributeName="opacity" values=".25;1;.25" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="319" cy="77" r="5"><animate attributeName="opacity" values="1;.25;1" dur="2.3s" repeatCount="indefinite"/></circle>
      <circle cx="248" cy="141" r="5"><animate attributeName="opacity" values=".3;1;.3" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="317" cy="208" r="5"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="0" y="0" width="460" height="285" rx="16" fill="none" stroke="#b0d6d8" stroke-opacity=".09"/>
  </g>
</svg>
